name: Validate Who Scene It
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce repository layout
        run: python scripts/check_layout.py
      - name: Build and run SDK, filesystem, update, and real timer checks
        run: python scripts/test.py --real-timer
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser test dependencies
        if: runner.os == 'Linux'
        run: npm ci
      - name: Install test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Browser behavior and real browser timers
        if: runner.os == 'Linux'
        run: npm run test:ui -- --real-timers
      - name: Package preview artifacts
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: WhoSceneIt-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
